# =============================================================================================
#  Weisshorn nose cone at a total length of 720 mm (coupler included), agreed with ST at the
#  interface meeting of 29.10.2026 (LV = 5.40 m, SE_REQ_04). Configuration of the report
#  2027_C_FD_REPORT-5_NOSE-CONE-720MM.
#
#    python studies/final_design.py configs/weisshorn_720.yaml  # design, equation, CAD, loads, heating
#    python -m nosecone run configs/weisshorn_720.yaml          # standard outputs of design A
#
#  Everything not set here comes from weisshorn_650.yaml (and weisshorn.yaml).
# =============================================================================================
base: weisshorn_650.yaml

project:
  name: Weisshorn-720
  output_dir: ../output/weisshorn_720

nose:                          # design A: GRV inside the nose (Req_13); B = Von Karman 705.5 + 20 (backup)
  design_profile: lvhaack
  design_fineness: 3.790806    # L = 682.3 mm to the sharp apex, 679.0 mm once blunted
  shoulder_length: 0.041       # coupler cylinder: 679.0 + 41 = 720 mm

robustness:
  fineness: 3.790806

trade_matrix:
  fineness: 3.790806

aerodynamics:
  transonic_onset: 0.94        # Fluent at M 0.95 (study 720): wave C_D 0.003-0.004, not the 0.05 of onset 0.8

heating:                       # Fluent calibration at burnout (CFD/study720, REPORT-5)
  calibration_stagnation: 0.946  # q_w(0) Fluent / Fay-Riddell: 0.943 (A), 0.949 (B)
  calibration_turbulent: 1.02    # median h Fluent / Eckert over x = 50 mm..shoulder: 1.010 (A), 1.033 (B)
  calibration_tip: 1.14          # heat into the tip insert (x <= 80 mm) Fluent / model: 1.133 (A), 1.145 (B)
